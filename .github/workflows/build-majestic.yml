  mingw64-runtime:
    name: Runtime (MinGW64)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: >-
          base-devel
          autoconf
          automake
          libtool
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-libtool

    - name: Build runtime
      shell: msys2 {0}
      working-directory: ./src/runtime/c
      run: |
        autoreconf -i
        ./configure
        make
        make install

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: libpgf-windows
        path: |
          ${{runner.temp}}/msys64/mingw64/bin/libpgf*
          ${{runner.temp}}/msys64/mingw64/bin/libgcc_s_seh-1.dll
          ${{runner.temp}}/msys64/mingw64/bin/libstdc++-6.dll
          ${{runner.temp}}/msys64/mingw64/bin/libwinpthread-1.dll
          ${{runner.temp}}/msys64/mingw64/lib/libpgf*
          ${{runner.temp}}/msys64/mingw64/include/pgf

  windows-haskell:
    name: Haskell (Windows)
    runs-on: windows-latest
    needs: mingw64-runtime

    steps:
    - uses: actions/checkout@v7
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: libpgf-windows

    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: 8

    - name: Install libpgf for GHC
      shell: pwsh
      run: |
        $ghcLibDir = ghc --print-libdir

        Copy-Item "${{ github.workspace }}\lib\*" "$ghcLibDir\..\mingw\lib\" -Force
        Copy-Item "${{ github.workspace }}\include\pgf" "$ghcLibDir\..\mingw\include\" -Recurse -Force
        Copy-Item "${{ github.workspace }}\bin\libpgf-0.dll" "$ghcLibDir\..\bin\" -Force

    - name: Install Haskell build tools
      run: |
        cabal v1-install alex happy

    - name: build and test the runtime
      working-directory: ./src/runtime/haskell
      run: |
        cabal v1-install
        cabal test

    - name: build the compiler
      working-directory: ./src/compiler
      run: |
        cabal v1-install

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiler-windows
        path: |
          ~/.cabal/bin/gf

  windows-python:
    name: Python (Windows)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install cibuildwheel
      run: |
        python3 -m pip install git+https://github.com/joerick/cibuildwheel.git@main

    - name: Install and test bindings
      env:
        CIBW_TEST_REQUIRES: pytest
        CIBW_TEST_COMMAND: "pytest   {project}\\src\\runtime\\python"
        CIBW_SKIP: "pp* *-win32"
      run: |
        python3 -m cibuildwheel src\runtime\python --output-dir wheelhouse

    - uses: actions/upload-artifact@v4
      with:
        name: python-windows
        path: ./wheelhouse

  upload_pypi:
    name: Upload to PyPI
    needs: [linux-python, macos-python, windows-python]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/majestic' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.x'

      - name: Install twine
        run: pip install twine

      - uses: actions/download-artifact@v4
        with:
          name: python-linux
          path: ./dist

      - uses: actions/download-artifact@v4
        with:
          name: python-macos
          path: ./dist

      - uses: actions/download-artifact@v4
        with:
          name: python-windows
          path: ./dist

      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.pypi_majestic_password }}
        run: |
          (cd ./src/runtime/python && curl -I --fail https://pypi.org/project/$(python setup.py --name)/$(python setup.py --version)/) || twine upload --skip-existing dist/*
